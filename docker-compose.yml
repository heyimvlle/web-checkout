services:
  mysql:
    image: mysql:8.4
    container_name: web-checkout-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web_checkout
      MYSQL_USER: checkout
      MYSQL_PASSWORD: checkout
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-checkout-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://checkout:checkout@mysql:3306/web_checkout
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-checkout-frontend
    restart: unless-stopped
    volumes:
      # Mapeia a pasta local /frontend para /app dentro do contêiner
      - ./frontend:/app
      # Evita que a pasta node_modules local sobrescreva a do contêiner (já que os SOs podem ser diferentes)
      - /app/node_modules
    environment:
      # URL acessada pelo browser do cliente (deve apontar para localhost na máquina host ou IP público)
      - VITE_API_URL=http://localhost:3001
      # Força o Vite a usar polling (ótimo para funcionar o Hot Reload em contêineres e sistemas operacionais variados)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
